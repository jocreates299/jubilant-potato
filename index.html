
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Homework Reminder app</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f1f5f9;
      padding: 20px;
    }
    h1 {
      color: #333;
    }
    input, button {
      padding: 10px;
      margin: 5px 0;
      font-size: 16px;
    }
    .task-list {
      margin-top: 20px;
    }
    .task-item {
      background: #e2e8f0;
      margin: 10px 0;
      padding: 10px;
      border-radius: 5px;
    }
    .timer {
      font-size: 18px;
      color: #d97706;
      margin-top: 10px;
    }
    .btn-group {
      margin-top: 10px;
    }
    .btn-group button {
      margin-right: 10px;
    }
  </style>
</head>
<body>

  <h1>📚 Homework Reminder</h1>

  <label>Task:</label><br/>
  <input type="text" id="taskInput" placeholder="e.g. Math homework" /><br/>

  <label>Due Date:</label><br/>
  <input type="date" id="dateInput" /><br/>

  <button onclick="addReminder()">Add Reminder</button>

  <div class="task-list" id="taskList">
    <!-- Tasks will appear here -->
  </div>

  <!-- Alarm Sound -->
  <audio id="alarmSound" src="https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg" preload="auto"></audio>

  <script>
    let tasks = [];
    let activeTimers = {};

    function addReminder() {
      const task = document.getElementById("taskInput").value;
      const date = document.getElementById("dateInput").value;

      if (!task || !date) {
        alert("Please enter both a task and due date!");
        return;
      }

      const taskItem = { task, date };
      tasks.push(taskItem);
      displayTasks();

      document.getElementById("taskInput").value = "";
      document.getElementById("dateInput").value = "";
      
      saveTasks();
    }

    function displayTasks() {
      const taskList = document.getElementById("taskList");
      taskList.innerHTML = "";
      tasks.forEach((t, index) => {
        const div = document.createElement("div");
        div.className = "task-item";
        div.innerHTML = `
          <strong>${t.task}</strong><br/>Due: ${t.date}
          <div class="btn-group">
            <button onclick="startHomework(${index})">Start Homework</button>
            <button onclick="deleteTask(${index})" style="background-color:#ef4444; color:white;">Delete</button>
          </div>
          <div id="timer-${index}" class="timer"></div>
        `;
        taskList.appendChild(div);
      });
    }

    function saveTasks() {
      localStorage.setItem("homeworkTasks", JSON.stringify(tasks));
    }

    function loadTasks() {
      const saved = localStorage.getItem("homeworkTasks");
      if (saved) {
        tasks = JSON.parse(saved);
        displayTasks();
      }
    }

    function checkDueDates() {
      const today = new Date().toISOString().split('T')[0];
      tasks.forEach(t => {
        if (t.date === today) {
          const alarm = document.getElementById("alarmSound");
          alarm.play().catch(() => {
            console.log("Alarm could not play automatically. Click somewhere on the page first.");
          });
          alert(`🔔 Reminder: "${t.task}" is due today!`);
        }
      });
    }

    function startHomework(index) {
      const timerDiv = document.getElementById(`timer-${index}`);
      let timeLeft = 60 * 60; // 60 minutes in seconds

      if (activeTimers[index]) {
        clearInterval(activeTimers[index]);
      }

      function updateTimer() {
        const minutes = Math.floor(timeLeft / 60);
        const seconds = timeLeft % 60;
        timerDiv.innerText = `⏳ Time Left: ${minutes}m ${seconds}s`;

        if (timeLeft <= 0) {
          clearInterval(activeTimers[index]);
          timerDiv.innerText = "✅ Time's up! Well done!";
          alert("⏰ 60 minutes are over! Great job!");
        }

        timeLeft--;
      }

      updateTimer();
      activeTimers[index] = setInterval(updateTimer, 1000);
    }

    function deleteTask(index) {
      if (confirm("Are you sure you finished this task?")) {
        tasks.splice(index, 1);
        clearInterval(activeTimers[index]); // Stop timer if running
        delete activeTimers[index];
        saveTasks();
        displayTasks();
      }
    }

    // Load tasks and check when page loads
    loadTasks();
    checkDueDates();

    // Keep checking every minute
    setInterval(checkDueDates, 60000); // 60000 ms = 1 minute

  </script>

</body>
</html>
